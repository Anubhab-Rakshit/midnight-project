<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="90%">
      <stop offset="0%" stop-color="#3a2660"/>
      <stop offset="55%" stop-color="#1b1030"/>
      <stop offset="100%" stop-color="#020203"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4b98a"/>
      <stop offset="50%" stop-color="#c2a878"/>
      <stop offset="100%" stop-color="#f0e6c8"/>
    </linearGradient>
    <linearGradient id="mono" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e6c8"/>
      <stop offset="100%" stop-color="#9c8548"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded badge -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)" stroke="url(#gold)" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Monolith / obelisk (the Oracle) -->
  <path d="M32 10 L40 46 L32 52 L24 46 Z" fill="url(#mono)" stroke="url(#gold)" stroke-opacity="0.8" stroke-width="1"/>

  <!-- Observation slit (the eye) -->
  <rect x="29" y="24" width="6" height="14" rx="3" fill="#020203" stroke="url(#gold)" stroke-opacity="0.9" stroke-width="1.2"/>

  <!-- Engraved base line -->
  <rect x="20" y="50" width="24" height="2.4" rx="1.2" fill="url(#gold)" opacity="0.85"/>
</svg>
